/* Operator layout: print visual → task queue → action detail. */
.workspace{grid-template-columns:minmax(280px,1fr) 220px 330px}
.workspace>section{grid-column:1;grid-row:1}
.workspace>aside:not(.taskpanel){grid-column:2;grid-row:1}
.workspace>.taskpanel{grid-column:3;grid-row:1}
.workspace .tasklist{padding:12px}
.workspace .taskitem{background:#252e3b;border:1px solid #354151;padding:17px 13px;margin-bottom:10px}
.workspace .taskitem.selected{background:#33444f;border-color:#64a7aa;box-shadow:0 0 0 1px #64a7aa40}
@media(min-width:1500px){.workspace{grid-template-columns:minmax(400px,1fr) 260px 400px}}
@media(min-width:651px) and (max-width:950px){.workspace{grid-template-columns:minmax(280px,1fr) 220px}.workspace>.taskpanel{grid-column:1/-1;grid-row:2}}
@media(max-width:650px){.workspace>section{order:0}.workspace>aside:not(.taskpanel){order:1}.workspace>.taskpanel{order:2}.workspace .tasklist{display:block}.workspace .taskitem{min-width:0}}

/* Review mirrors Live job: evidence → queue → decision. */
.reviewgrid{grid-template-columns:minmax(280px,1fr) 220px 330px;align-items:start}
.reviewgrid>.reviewhero{grid-column:1;grid-row:1}
.reviewgrid>aside:not(.reviewdecision){grid-column:2;grid-row:1}

@media(min-width:1500px){.reviewgrid{grid-template-columns:minmax(400px,1fr) 260px 400px}}

@media(max-width:650px){.reviewgrid>.reviewhero{order:0}.reviewgrid>aside:not(.reviewdecision){order:1}.reviewgrid>.reviewdecision{order:2}}

</style></head><body><div id="app"></div><script>const $=s=>document.querySelector(s);
const scenarios={clean:'01 · Operator-centric task queue',review:'02 · Human review',retake:'03 · Retake evidence',rework:'04 · Discrepancy & rework',offline:'05 · Offline & reconnect',help:'06 · Contextual help'};
const base=()=>({scenario:'clean',page:'operator',selected:'ties',ack:false,count:null,evidence:false,result:null,eligible:false,offline:false,drawer:null,helpStatus:null,flag:null,history:[],step:0,reworked:false,retaken:false,revision:0});
let s=base(); let toastTimer;
function event(name,detail,actor='Operator'){s.history.unshift({time:new Date().toLocaleTimeString([], {timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',second:'2-digit'}),name,detail,actor});}
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.role='status';d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3200)}
function reset(scenario=s.scenario){s={...base(),scenario,offline:scenario==='offline'};event('Scenario loaded',scenarios[scenario],'Presenter');render()}
function model(evidence=false){const points=[[115,200],[165,175],[215,150],[265,125],[315,100],[365,125],[415,150],[365,175],[315,200],[265,225]];const bad=evidence&&s.scenario==='rework'&&!s.reworked;return `<svg class="model" viewBox="0 0 540 330" role="img" aria-label="Layer 5 schematic with ten planned reinforcement tie positions"><defs><pattern id="grid${evidence}" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="matrix(1 .5 -1 .5 270 -80)"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#608080" stroke-opacity=".17" stroke-width=".8"/></pattern><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#b0c1c8"/><stop offset="1" stop-color="#526b79"/></linearGradient></defs><rect width="540" height="330" fill="url(#grid${evidence})"/><path d="M75 215L280 112L465 205L260 308Z" fill="#1d3540" stroke="#47606d"/><path d="M105 197L310 94L432 155L432 184L310 123L105 226Z" fill="url(#wall)"/><path d="M105 197L227 258L432 155L432 184L227 287L105 226Z" fill="#627e8a"/><path d="M105 197L227 258L432 155 M105 204L227 265L432 162 M105 212L227 273L432 170 M105 220L227 281L432 178" fill="none" stroke="#243c49" stroke-width="1.7"/><path d="M105 197L310 94L432 155L227 258Z" fill="#9bacb4" stroke="#d0dde0" stroke-width="2"/><path d="M117 197L310 101L418 155L227 251Z" fill="#283d46"/><path d="M225 142L332 196 M276 117L383 170" stroke="#8ea5ad" stroke-width="9"/><path d="M105 197L310 94L432 155L227 258Z" fill="none" stroke="#35e1da" stroke-width="3"/>${points.map(([x,y],i)=>`<g class="tiepoint" data-point="${i+1}" tabindex="0" role="button" aria-label="Planned position ${i+1}"><circle cx="${x}" cy="${y}" r="11" fill="${bad&&i>7?'#604435':'#163e42'}" stroke="${bad&&i>7?'#ffc078':'#35e1da'}" stroke-width="1.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" fill="#fff">${i+1}</text></g>`).join('')}<path d="M432 155L480 130L500 130" fill="none" stroke="#7f969e"/><text x="455" y="118" font-size="10" fill="#c9d8dd">LAYER 05</text><text x="35" y="310" font-size="9" fill="#8ca7b4">SCHEMATIC · NOT TO SCALE</text></svg>`}
function evidence(){return `<div class="evidence">${model(true)}<div class="evidence-label mono">Evidence frame · L5 / T-005 · ${s.offline?'Saved locally — not synced':'Evidence attached'}${s.retaken?' · retake 02':''}</div></div>`}
const button=(label,action,cls='',disabled=false)=>`<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function resultBox(){if(!s.result)return '';let map={verified:['✓ Count / presence verified','10 of 10 planned ties matched. Confidence 98%.'],review:['◈ Human review required','Count is uncertain. Confidence 72%. A reviewer must inspect the evidence.'],retake:['↻ Capture needs a retake','The view is obstructed. No finding has been made about the work.'],mismatch:['◈ Possible count mismatch','8 visible against 10 planned. A human must confirm this observation.'],rework:['↻ Rework requested by site lead','Two positions need attention. Correct the work, then record a new attestation and evidence.'],human:['✓ Count / presence confirmed','Site lead confirmed 10 ties present against the task standard.'],pending:['◷ Evidence queued offline','Saved in this walkthrough. Reconnect before requesting verification.']};let [title,text]=map[s.result];return `<div class="result ${!s.eligible?'warn':''}" role="status"><strong>${title}</strong><p>${text}</p></div>`}
function gate(){return `<div class="gate"><span>${s.eligible?'✓':'▣'} Cover gate</span><strong class="${s.eligible?'green':'orange'}">${s.eligible?'Eligible to continue':'Blocked · awaiting check'}</strong></div>`}
function taskActions(){return `<div><div class="checkrow"><span class="${s.ack?'cyan':'muted'}">${s.ack?'✓':'○'}</span><b>${s.ack?'Task acknowledged':'Acknowledge the task to begin'}</b></div>${!s.ack?button('Acknowledge task','ack','primary wide'):''}${s.ack?`<div class="separator"></div><div class="row" style="justify-content:space-between"><h3>Record the work</h3><span class="tag">${s.count===null?'Not attested':s.count+' / 10 placed'}</span></div>${button(s.count===null?'Confirm 10 ties placed':'Reconfirm 10 ties placed','attest','primary wide')}${button('Edit placed count','count','wide small')}${s.count!==null?`<div class="separator"></div><h3>Evidence</h3>${s.evidence?evidence():`<p class="muted" style="font-size:12px">Attach a frame to this task and layer before verification.</p>`}${button(s.evidence?'Replace frame':'Capture frame','capture','wide')}${s.evidence?`<label for="checkOutcome" class="mono muted">Walkthrough: verification outcome</label><select id="checkOutcome" class="outcome-select">${Object.entries({clean:'Count matches',review:'Human review needed',retake:'Capture needs retake',rework:'Possible discrepancy'}).map(([id,label])=>`<option value="${id}" ${s.scenario===id?'selected':''}>${label}</option>`).join('')}</select>${button('Verify count and presence','verify','primary wide',s.offline||s.count!==10)}`:''}${s.count!==10?'<p class="footnote orange">Count differs from the standard. Correct or review the work before verification.</p>':''}`:''}`:''}${resultBox()}${['review','mismatch'].includes(s.result)?button('Open reviewer workspace →','reviewpage','wide'):''}${s.result==='retake'?button('Retake clear frame','retake','primary wide'):''}${s.result==='rework'?button('Work corrected · start new attempt','rework','primary wide'):''}${gate()}${button(s.step?'Next layer started ✓':'Continue to next layer →','continue','primary wide',!s.eligible||s.offline||!!s.step)}<div class="separator"></div><div class="twocol">${button('↗ Get help','help')}${button('⚑ Flag issue','flag')}</div><p class="footnote">Checks confirm count and presence only. They do not certify installation quality or structural acceptance.</p></div>`}
function queue(){return `<aside class="panel"><div class="panelhead"><span class="mono">Task queue</span><span class="muted">04</span></div><div class="tasklist">${[['printing','Titan','Print layer 5','Paused at manual task'],['ties','Operator','Place reinforcement ties','L5 · 10 positions'],['refill','ICON team','Material refill','Expected in 15 min'],['cleaning','Titan','Cleaning cycle','Scheduled in 30 min']].map(([id,actor,name,sub])=>`<button class="taskitem ${s.selected===id?'selected':''}" data-select="${id}"><span class="mono ${id==='ties'?'cyan':'muted'}">${actor}</span><strong>${name}</strong><small>${sub}</small></button>`).join('')}</div><div style="padding:16px" class="footnote">Every action has an owner.<br>Only operator tasks require your attestation.</div></aside>`}
function operator(){return `<div class="phasebar"><div class="phase done">01 &nbsp; Setup ✓</div><div class="phase done">02 &nbsp; Startup ✓</div><div class="phase current">03 &nbsp; Printing + construction</div><div class="phase">04 &nbsp; Shutdown</div></div><div class="workspace">${queue()}<section><div class="panel view"><div class="viewbar"><span class="mono">Lot 23 / Layer ${s.step?'06':'05'}</span><span class="viewtoggle">◈ Layer view</span></div>${model()}<div class="viewfoot"><span><span class="status-dot"></span>10 planned tie positions</span><span>Model v2.0 · Published</span></div></div><div class="metrics"><div class="metric"><span class="mono muted">Print progress</span><strong>${s.step?'6':'5'} <span class="muted" style="font-size:13px">/ 125 layers</span></strong><div class="progress"><i style="width:${s.step?'7':'5'}%"></i></div></div><div class="metric"><span class="mono muted">Next manual task</span><strong>Now</strong><span class="muted" style="font-size:11px">Reinforcement ties</span></div><div class="metric"><span class="mono muted">FormCrete</span><strong>68<span style="font-size:13px">%</span></strong><span class="muted" style="font-size:11px">Refill in 15 min</span></div></div><div class="timeline"><span>${s.offline?'● Offline · displayed state is stale':'● Connected · updated just now'}</span><span>Machine status: current</span></div></section><aside class="panel taskpanel"><div class="panelhead"><span class="mono cyan">${s.selected==='ties'?'Your action':'Task context'}</span><span class="tag">${s.selected==='ties'?'Critical task':'Read only'}</span></div><div class="taskbody">${s.selected==='ties'?`<div><h2>Place reinforcement ties</h2><div class="row"><span class="tag">LAYER 05</span><span class="mono muted">T-005 / Operator</span></div><div class="component"><div class="component-icon">⊓</div><div><strong>Prepare 10 ties</strong><p>One at each marked design position.</p></div></div><ol class="steps"><li>Locate positions 1–10 on this layer.</li><li>Place the ties using the approved site procedure.</li><li>Confirm the count and record evidence.</li><li><button class="reference-link" data-action="reference">RT-01 · standard v1.2 ↗</button><span class="muted"> — component reference and task guidance</span></li></ol><p class="footnote"></p></div>${taskActions()}`:otherTask()}</div></aside></div>`}
function otherTask(){const data={printing:['Print layer 5','Titan','The print is waiting at the manual-task gate. The machine will not cover this area until the critical task is checked.'],refill:['Material refill','ICON team','The assigned team owns this delivery. The latest update shows arrival in 15 minutes.'],cleaning:['Cleaning cycle','Titan','A maintenance cycle is scheduled in 30 minutes. This machine-owned entry does not require an operator completion.']}[s.selected];return `<div><h2>${data[0]}</h2><span class="tag">${data[1]}</span><p class="muted">${data[2]}</p>${button('Return to your task','ties','primary wide')}${button('Get contextual help','help','wide')}</div>`}
function review(){let ready=['review','mismatch'].includes(s.result);return `<div class="reviewgrid"><aside class="panel"><div class="panelhead mono">Review queue <span class="cyan">${ready?'01':'00'}</span></div><div style="padding:15px">${ready?'<span class="tag">Awaiting site lead</span><h3 style="margin-top:16px">Reinforcement ties</h3><p class="muted">Lot 23 · Layer 05<br>Task T-005</p>':'<p class="muted">No unresolved review requests.</p>'}</div></aside><section class="panel reviewhero"><div class="row" style="justify-content:space-between"><span class="mono cyan">Evidence review</span><span class="tag">Site lead</span></div><h2>Check the work. Keep the context.</h2>${s.evidence?evidence():'<div class="empty">Capture evidence in the operator workspace first.</div>'}<div class="twocol"><div class="context">STANDARD<br><strong>10 ties · positions 1–10</strong><br>Layer 5 · standard v1.2</div><div class="context">ATTESTATION<br><strong>${s.count??'—'} ties placed</strong><br>Attempt revision ${s.revision}</div></div>${resultBox()}<p class="footnote"></p></section><aside class="panel reviewdecision"><div class="panelhead mono">Human decision</div><div style="padding:20px"><p class="muted">Inspect the evidence against the planned count and positions. Every decision is recorded with its reason.</p><label for="reviewReason">Decision reason</label><textarea id="reviewReason" placeholder="What did you confirm or what needs attention?"></textarea>${button('Confirm 10 ties present','approve','primary wide',!ready||s.offline||s.result==='mismatch')}${button('Request a clearer frame','requestRetake','wide',!ready||s.offline)}${button('Confirm discrepancy · rework','requestRework','wide',!ready||s.offline)}${button('Escalate to site lead','escalate','wide',!ready||s.offline)}${s.result==='mismatch'?'<p class="footnote orange">A possible mismatch cannot be approved as matching. Confirm the discrepancy or request another frame.</p>':''}${s.offline?'<p class="orange">Offline — review decisions unavailable.</p>':''}${gate()}</div></aside></div>`}
function history(){return `<div class="filterbar"><div><span class="mono cyan">Live job evidence record</span><h2 style="margin-bottom:0">A task is more than a checkmark.</h2></div><span class="tag">Lot 23 · Current walkthrough</span></div><div class="panel"><table class="historytable"><thead><tr><th>TIME</th><th>EVENT / DETAIL</th><th>ACTOR</th><th>CONTEXT</th></tr></thead><tbody>${s.history.map(e=>`<tr><td class="mono muted">${e.time}</td><td><strong>${escapeHtml(e.name)}</strong><br><span class="muted">${escapeHtml(e.detail)}</span></td><td>${e.actor}</td><td class="mono muted">T-005 · L5<br>TASK EVENT</td></tr>`).join('')}</tbody></table></div><div class="note">Acknowledgment, attestation, evidence and verification remain separate events. Records shown are from the current session.</div>`}
const disclaimer=()=>`<footer class="prototype-disclaimer">Prototype disclaimer: All content, job data, images, verification results, support responses, and connectivity states are simulated. No machine or support service is connected, and no real messages are sent.</footer>`;
function drawer(){if(!s.drawer)return '';let content='';if(s.drawer==='reference')content=`<span class="mono cyan">Knowledge base</span><h2>RT-01 · Reinforcement ties</h2><span class="tag">Standard v1.2</span><div class="context">Applies to: Task T-005 · Layer 5<br>Required count: 10 ties<br>Positions: 1–10 on the layer model</div><h3>Task reference</h3><p>Use the marked positions in the task model to locate each tie. Record the placed count and attach evidence to this task.</p><h3>Before continuing</h3><p>The count and presence check or site-lead confirmation must be complete before the next layer covers this area.</p><p class="footnote">Use the approved site documentation for component specifications and installation procedures.</p>`;else if(s.drawer==='count')content=`<h2>Edit placed count</h2><p>The design requires 10 ties. Record what is actually placed; this does not change the standard.</p><label for="count">Placed count</label><input id="count" type="number" min="0" step="1" value="${s.count??10}"><label for="countReason">Reason (optional)</label><textarea id="countReason" placeholder="For example: two components missing"></textarea>${button('Record count','saveCount','primary wide')}`;else if(s.drawer==='flag')content=`<h2>What got in the way?</h2><p>One tap on a reason records the issue with this task's context. No separate ticket form.</p>${['Unclear instruction','Count / position differs','Component missing','Equipment / material issue','Other'].map(x=>`<button class="decision" data-flag="${x}">${x} ↗</button>`).join('')}<p class="footnote">Need assistance now? Use Get help. Flagging an issue does not request urgent support.</p>`;else content=`<h2>Get help</h2><div class="context"><span class="mono muted">Context attached automatically</span><br>Project: TexNext Ranch · Lot 23<br>Task: ${s.selected==='ties'?'Place reinforcement ties':s.selected}<br>Layer / item: L5 / 2.1<br>Machine: Titan T-001 · waiting<br>Software: v0.1 · standard v1.2<br>Connection: ${s.offline?'Offline · information stale':'Connected · just updated'}</div><p class="footnote"></p>${s.helpStatus?`<div class="result ${s.offline?'warn':''}"><strong>${s.helpStatus==='queued'?'◷ Queued locally':s.helpStatus==='ack'?'✓ Acknowledged · ICON Support':s.helpStatus==='resolved'?'✓ Useful help received':'↗ Request submitted'}</strong><p>${s.helpStatus==='queued'?'Reconnect to send the request.':s.helpStatus==='ack'?'Owner: Alex · ICON Support. Please confirm the marked positions against the task reference.':'Your job context stays with the request.'}</p></div>`:''}<label for="helpNote">What do you need? (optional)</label><textarea id="helpNote" placeholder="Add a short note if useful"></textarea>${button('Request help','sendHelp','primary wide')}${button('Urgent help · explicit escalation','urgent','wide')}${s.helpStatus==='sent'?button('View support response','helpAck','wide'):''}${s.helpStatus==='ack'?button('This helped · return to task','helpResolved','primary wide'):''}`;return `<div class="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="Task action"><div style="text-align:right">${button('Close ×','close','small')}</div>${content}${disclaimer()}</section></div>`}
function render(){document.title='BuildOS — '+(s.page==='review'?'Evidence review':s.page==='history'?'Live history':'Live job concept');$('#app').innerHTML=`<header><div class="brand">BuildOS<span>/ Field operations</span></div><nav class="topnav" aria-label="Workspaces">${[['operator','Live job'],['review','Review'+(['review','mismatch'].includes(s.result)?' · 1':'')],['history','History']].map(([id,n])=>`<button data-page="${id}" class="${s.page===id?'active':''}">${n}</button>`).join('')}</nav><div class="header-right"><span class="mono ${s.offline?'orange':'cyan'}">${s.offline?'○ Offline':'● Connected'}</span>${button(s.offline?'Reconnect':'Go offline','connection','small')}</div></header><main><div class="jobheading"><div><span class="eyebrow muted">Live print / Residential / T-001</span><h1>TexNext Ranch <span class="muted">/ Lot 23</span></h1><span class="muted" style="font-size:12px">Ranch Mesa · Model v2.0 · Active job</span></div><div style="text-align:right"><span class="tag ${s.eligible?'green':'orange'}">${s.step?'▶ Printing layer 6':s.eligible?'✓ Ready to continue':'Ⅱ Waiting for manual task'}</span><p class="mono muted" style="font-size:9px">PRINT SUITE T-001 / SHIFT 01</p></div></div>${s.page==='operator'?operator():s.page==='review'?review():history()}</main><div class="presenter" aria-label="Presenter controls"><div class="row"><span class="mono cyan">Walkthrough</span><span class="feature-name">Operator-centric task queue</span></div><span class="mono muted explain">Operator task walkthrough</span><div class="row presenter-only"><span class="mono muted">Presenter only</span>${button('↻ Reset walkthrough','reset','small')}</div></div>${disclaimer()}${drawer()}`;bind();}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{s.page=b.dataset.page;render()});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.select;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{s.flag=b.dataset.flag;event('Issue flagged',s.flag+(s.offline?' · queued locally':''));s.drawer=null;render();toast('Issue recorded with task context'+(s.offline?' · queued offline':''))});if($('#checkOutcome'))$('#checkOutcome').onchange=e=>{s.scenario=e.target.value;s.result=null;s.eligible=false;render()};document.querySelectorAll('[data-point]').forEach(b=>{b.onclick=()=>toast('Position '+b.dataset.point+' · reinforcement tie · L5');b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.onclick()}}});}
function act(a){switch(a){case'ack':s.ack=true;event('Task acknowledged','Operator opened the layer-specific standard');break;case'attest':s.count=10;s.revision++;s.result=null;s.eligible=false;s.evidence=false;event('Count attested','10 ties placed · revision '+s.revision);break;case'count':s.drawer='count';break;case'reference':s.drawer='reference';break;case'saveCount':{let v=$('#count').value; if(v.trim()===''||!Number.isInteger(Number(v))||Number(v)<0||Number(v)>1000){toast('Enter a whole number between 0 and 1000');return} s.count=Number(v);s.revision++;s.result=null;s.eligible=false;s.evidence=false;event('Attestation amended',s.count+' of 10 · '+($('#countReason').value||'No reason added'));s.drawer=null;break}case'capture':s.evidence=true;s.result=s.offline?'pending':null;s.eligible=false;event('Evidence recorded',s.offline?'Evidence frame · queued locally':'Evidence frame · task and layer bound');break;case'verify':if(!s.evidence||s.count!==10||s.offline)return;s.result=s.scenario==='review'?'review':s.scenario==='retake'&&!s.retaken?'retake':s.scenario==='rework'&&!s.reworked?'mismatch':'verified';s.eligible=s.result==='verified';event('Verification completed',s.result+' · standard v1.2 / model v0.1','System');break;case'reviewpage':s.page='review';break;case'retake':s.retaken=true;s.evidence=true;s.result=null;s.eligible=false;event('Evidence retaken','New clear frame; previous attempt retained');break;case'rework':s.reworked=true;s.ack=true;s.count=null;s.evidence=false;s.result=null;s.eligible=false;s.page='operator';event('Rework started','Positions 9 and 10 corrected; new attestation required');break;case'approve':case'requestRetake':case'requestRework':case'escalate':{if(s.offline)return;const reason=$('#reviewReason').value.trim();if(!reason){toast('Add a decision reason to keep the record clear');$('#reviewReason').focus();return}if(a==='approve'){if(s.result==='mismatch')return;s.result='human';s.eligible=true;event('Count / presence confirmed',reason,'Site lead')}if(a==='requestRetake'){s.result='retake';s.eligible=false;event('Retake requested',reason,'Site lead')}if(a==='requestRework'){s.result='rework';s.eligible=false;event('Discrepancy confirmed — rework',reason,'Site lead')}if(a==='escalate'){event('Review escalated',reason,'Site lead');toast('Escalated in the walkthrough · cover remains blocked')}if(a!=='escalate')s.page='operator';break}case'continue':if(!s.eligible||s.offline||s.step)return;s.step=1;event('Next layer started','Dependent cover action released after scoped check','Titan');toast('Layer 6 started');break;case'connection':s.offline=!s.offline;event(s.offline?'Connection lost':'Reconnected',s.offline?'Machine state stale; local actions available':'Sync complete','System');if(!s.offline){if(s.result==='pending')s.result=null;if(s.helpStatus==='queued'){s.helpStatus='sent';event('Help submitted','Queued context delivered','System')}}break;case'reset':reset();return;case'help':s.drawer='help';break;case'flag':s.drawer='flag';break;case'close':s.drawer=null;break;case'ties':s.selected='ties';break;case'sendHelp':s.helpStatus=s.offline?'queued':'sent';event('Help requested',(s.offline?'Queued locally · no receipt':'Context attached · request submitted')+($('#helpNote').value.trim()?' · '+$('#helpNote').value.trim():''));break;case'urgent':s.helpStatus=s.offline?'queued':'sent';event('Urgent assistance requested','Explicit escalation · '+(s.offline?'offline; no delivery':'request submitted'));toast(s.offline?'Offline · urgent request has not been delivered':'Urgent assistance requested');break;case'helpAck':s.helpStatus='ack';event('Help acknowledged','Alex · ICON Support','ICON team');break;case'helpResolved':s.helpStatus='resolved';event('Useful assistance confirmed','Operator confirmed the guidance helped');s.drawer=null;break;}render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.drawer){s.drawer=null;render()}});event('Job opened','TexNext Ranch · Lot 23 · Layer 5','System');render();
</script><script>/* P1 interaction layer: all services and readings use local scenario fixtures. */
const p1Defaults=()=>({voice:'idle',transcript:'',note:'',triage:null,triageApproved:false,callback:'none',explicitUrgent:false,condition:'weather',weather:'clear',mix:'ready',weatherDecision:null,mixDecision:null,equipment:'camera',equipmentState:'normal',equipmentChecked:false,feedbackItem:'guidance',feedbackAck:false,siteHold:false});
function ensureP1(){if(!s.p1)s.p1=p1Defaults()}
const originalRender=render,originalAct=act,originalBind=bind,originalDrawer=drawer,originalGate=gate;
gate=function(){ensureP1();return s.p1.siteHold?'<div class="gate"><span>▣ Site hold</span><strong class="orange">Blocked · site lead review</strong></div>':originalGate()};
function voiceSection(){let p=s.p1;return `<div class="voice-box"><div class="row" style="justify-content:space-between"><h3>Voice note</h3><span class="tag">${p.voice==='recording'?'● Recording':p.transcript?'Transcript ready':'Optional'}</span></div><p class="muted">Describe the issue. Review the text before sending.</p>${p.voice==='recording'?`<div class="wave" aria-label="Recording in progress">${Array.from({length:28},(_,i)=>`<i style="height:${12+(i*17%27)}px"></i>`).join('')}</div>${button('Stop recording','p1-stop','primary wide')}`:button(p.transcript?'Record again':'● Record voice note','p1-record','wide',s.offline)}${p.transcript?`<label for="transcript">Review transcript</label><textarea id="transcript">${escapeHtml(p.transcript)}</textarea>${button('Use this note','p1-useVoice','wide')}`:''}${s.offline?'<p class="footnote orange">Voice transcription unavailable offline. Type a note instead.</p>':''}</div>`}
function triageBox(){let p=s.p1;if(!p.triage)return '';return `<div class="result"><h3>Request details</h3><p><strong>${escapeHtml(p.triage.category)}</strong> · ${p.triage.urgency==='urgent'?'Urgent review':'Standard priority'}</p><p>${escapeHtml(p.triage.summary)}</p><p>Owner: ${p.triageApproved?'Alex · ICON Support':'Support coordinator · awaiting review'}</p><p>${p.triageApproved?'Routing confirmed by support coordinator.':'Suggested routing will be checked by a support coordinator.'}</p>${button('Open support review','p1-triageReview','wide')}${p.callback!=='none'?`<p class="orange">${p.callback==='requested'?'Callback requested · awaiting acknowledgment':p.callback==='assigned'?'Alex owns the callback · ready to contact operator':'Callback completed · assistance recorded'}</p>`:''}</div>`}
drawer=function(){ensureP1();let p=s.p1;if(s.drawer==='supportReview')return `<div class="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="Support review"><div style="text-align:right">${button('Close ×','close','small')}</div><h2>Review help request</h2><span class="tag">Support coordinator</span><div class="context">Lot 23 · L5 · T-005<br>${escapeHtml(p.triage?.summary||p.note||'Operator requested assistance.')}</div><label for="triageCategory">Request type</label><select id="triageCategory" class="outcome-select">${['Support need','Product feedback','Feature request'].map(c=>`<option ${p.triage?.category===c?'selected':''}>${c}</option>`).join('')}</select><label for="triageUrgency">Priority</label><select id="triageUrgency" class="outcome-select"><option value="standard" ${p.triage?.urgency!=='urgent'?'selected':''}>Standard</option><option value="urgent" ${p.triage?.urgency==='urgent'?'selected':''}>Urgent</option></select><p class="muted">Confirm the request type and priority before assigning it. The operator's urgent-help request always takes precedence.</p>${button('Confirm routing · assign Alex','p1-confirmTriage','primary wide',s.offline)}${p.callback==='requested'?button('Acknowledge callback','p1-callbackAssign','wide',s.offline):''}${p.callback==='assigned'?button('Record completed callback','p1-callbackDone','wide',s.offline):''}${button('Return to Get help','help','wide')}${disclaimer()}</section></div>`;
let html=originalDrawer();if(s.drawer==='help'){html=html.replace('<label for="helpNote">',voiceSection()+triageBox()+'<label for="helpNote">').replace('<textarea id="helpNote" placeholder="Add a short note if useful"></textarea>',`<textarea id="helpNote" placeholder="Add a short note if useful">${escapeHtml(p.note)}</textarea>`)}return html};
function p1Queue(items,current,action){return `<aside class="panel"><div class="panelhead mono">${action==='condition'?'Site checks':action==='equipment'?'Equipment checks':'Reported issues'}</div><div class="tasklist">${items.map(([id,title,sub])=>`<button class="taskitem ${current===id?'selected':''}" data-p1-${action}="${id}"><span class="mono muted">${sub}</span><strong>${title}</strong></button>`).join('')}</div></aside>`}

function p1Act(a){let p=s.p1;switch(a){case'p1-record':p.voice='recording';p.transcript='';event('Voice note started','Help / task context attached');break;case'p1-stop':p.voice='ready';p.transcript='Two tie positions are difficult to identify on this layer. Can someone check the reference with me?';event('Voice transcript ready','Operator review required');break;case'p1-useVoice':p.transcript=$('#transcript').value;p.note=p.transcript;toast('Transcript added to the help request');break;case'p1-triageReview':s.drawer='supportReview';break;case'p1-confirmTriage':if(s.offline)return;p.triage.category=$('#triageCategory').value;p.triage.urgency=p.explicitUrgent?'urgent':$('#triageUrgency').value;p.triageApproved=true;if(p.triage.urgency==='urgent')p.callback='requested';event('Help routing confirmed',p.triage.category+' / '+p.triage.urgency,'Support coordinator');toast('Assigned to Alex · ICON Support');break;case'p1-callbackAssign':p.callback='assigned';event('Callback acknowledged','Alex owns operator callback','ICON Support');break;case'p1-callbackDone':p.callback='done';event('Callback completed','Assistance recorded','ICON Support');break;case'p1-weatherGo':case'p1-mixReady':case'p1-weatherHold':case'p1-mixHold':{if(s.offline)return;let note=$('#conditionNote').value.trim();if(!note){toast('Record what you checked');$('#conditionNote').focus();return}let hold=a.endsWith('Hold');if(hold)p.siteHold=true;if(a.includes('weather'))p.weatherDecision=hold?'Hold requested':'Within limits';else p.mixDecision=hold?'Material review requested':'Test bead accepted';event('Site decision recorded',(hold?'Hold / review: ':'Check accepted: ')+note);break}case'p1-equipmentCheck':if(s.offline)return;p.equipmentChecked=true;event('Equipment check recorded',p.equipment+' / expected signal');break;case'p1-equipmentHold':p.siteHold=true;event('Equipment review requested',p.equipment+' / site hold');break;case'p1-holdReview':s.drawer='holdReview';break;case'p1-releaseHold':{if(p.weather= const p1Drawer=drawer;drawer=function(){ensureP1();if(s.drawer!=='holdReview')return p1Drawer();return `<div class="drawer-overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="Review site hold"><div style="text-align:right">${button('Close ×','close','small')}</div><h2>Review site hold</h2><span class="tag">Site lead</span><p class="muted">Confirm the conditions and responsible team's findings before releasing this hold. Task verification remains a separate requirement.</p><label for="holdReason">Decision reason</label><textarea id="holdReason" placeholder="Record the checks and why the hold can be released"></textarea>${button('Release site hold','p1-releaseHold','primary wide',s.offline)}${disclaimer()}</section></div>`};
act=function(a){ensureP1();if(a.startsWith('p1-')){p1Act(a);return}if(a==='sendHelp'||a==='urgent'){let note=$('#helpNote')?.value.trim()||s.p1.note;s.p1.note=note;s.p1.triage={category:'Support need',urgency:a==='urgent'?'urgent':'standard',summary:note||'Operator requested help with the active task.'};s.p1.triageApproved=false;if(a==='urgent'){s.p1.callback='requested';s.p1.explicitUrgent=true;s.p1.triage.urgency='urgent';}}if(a==='continue'&&s.p1.siteHold){toast('Site hold must be reviewed before continuing');return}originalAct(a)};
bind=function(){originalBind();if($('#helpNote'))$('#helpNote').oninput=e=>s.p1.note=e.target.value;if($('#transcript'))$('#transcript').oninput=e=>s.p1.transcript=e.target.value;document.querySelectorAll('[data-p1-condition]').forEach(b=>b.onclick=()=>{s.p1.condition=b.dataset.p1Condition;render()});document.querySelectorAll('[data-p1-equipment]').forEach(b=>b.onclick=()=>{s.p1.equipment=b.dataset.p1Equipment;render()});document.querySelectorAll('[data-p1-feedback]').forEach(b=>b.onclick=()=>{s.p1.feedbackItem=b.dataset.p1Feedback;s.p1.feedbackAck=false;render()});if($('#conditionScenario'))$('#conditionScenario').onchange=e=>{s.p1[s.p1.condition+'Decision']=null;s.p1[s.p1.condition]=e.target.value==='alert'?(s.p1.condition==='weather'?'warning':'review'):(s.p1.condition==='weather'?'clear':'ready');if(e.target.value==='alert')s.p1.siteHold=true;render()};if($('#equipmentScenario'))$('#equipmentScenario').onchange=e=>{s.p1.equipmentState=e.target.value;s.p1.equipmentChecked=false;if(e.target.value==='alert')s.p1.siteHold=true;render()};if($('#featureView'))$('#featureView').onchange=e=>{s.page=e.target.value;s.drawer=null;render()};};

act=function(a){ensureP1();if(a==='p1-openConditions'){s.page='conditions';render();return}if(a==='p1-openEquipment'){s.page='equipment';render();return}if(a==='reviewpage')s.role='lead';if(a==='p1-triageReview')s.role='support';if(a==='p1-holdReview')s.role='lead';if(a==='p1-cameraTask')s.role='operator';if(a==='help'&&s.role==='support'){s.role='operator';s.page='operator';}if(a==='role-updates'){s.role='support';s.page='feedback';render();return}if(a==='role-requests'){s.page='support';render();return}if(a==='role-publishUpdate'){let reason=$('#updateReason').value.trim();if(!reason){toast('Add the review note before publishing');return}if(!s.p1.publishedUpdates)s.p1.publishedUpdates={};s.p1.publishedUpdates[s.p1.feedbackItem]=true;event('Operator update published',s.p1.feedbackItem+' / '+reason,'ICON Support');render();return}roleAct(a);if(['approve','requestRetake','requestRework'].includes(a)&&!s.drawer){s.role='lead';s.page='review';render()}};

function futureLayout(visual,actions){return `<div class="future-banner"><span class="tag">Exploratory concept</span><span>Proposed workflows and hardware behavior. Not an available BuildOS capability.</span></div><div class="reviewgrid p1grid">${futureQueue()}<section class="panel reviewhero">${visual}</section><aside class="panel reviewdecision"><div class="panelhead mono">${s.future.view==='fleet'?'Supervisor action':'Concept walkthrough'}</div><div class="taskbody">${actions}</div></aside></div>`}
function assumptions(items){return `<details class="assumptions"><summary>Assumptions and open questions</summary><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></details>`}
function exceptionConcept(){let f=s.future,refill=f.exception==='refill';return futureLayout(`<span class="mono cyan">P2 / Live-job exceptions</span><h2>${refill?'Material delivery delayed':'Required component missing'}</h2><div class="exception-flow"><div class="context"><span class="mono muted">Detected</span><h3>${refill?'Refill ETA exceeds available supply':'8 ties available / 10 required'}</h3><p>${refill?'Refill expected in 25 min; estimated supply remaining 12 min.':'Positions 9 and 10 cannot be completed with the current supply.'}</p></div><div class="flow-arrow">↓</div><div class="context"><span class="mono muted">Owner</span><h3>${f.assigned?(refill?'Maya · ICON Logistics':'Jordan · Site lead'):'Awaiting assignment'}</h3><p>${f.assigned?'Owner accepted the issue and is coordinating the next action.':'The operator requests help without taking ownership of delivery or engineering decisions.'}</p></div><div class="flow-arrow">↓</div><div class="result ${f.delivery?'':'warn'}"><h3>${f.delivery?'Supply confirmed · task can be resumed':'Affected print area held'}</h3><p>${f.delivery?'The hold on this exception is resolved. The operator must still complete the task and its verification.':'Unrelated work may continue only if the approved plan permits it. No automatic substitute or unapproved material is used.'}</p></div></div>${assumptions(['Material depletion predictions and delivery ETAs must be reliable.','Operations must define assignment and escalation coverage.','Any decision to continue other work must follow an approved print sequence.'])}`,`<h2>Resolve the handoff</h2><label for="exceptionType">Exception</label><select id="exceptionType" class="outcome-select"><option value="refill" ${refill?'selected':''}>Delayed refill</option><option value="missing" ${!refill?'selected':''}>Missing ties</option></select>${button(f.assigned?'✓ Owner assigned':'Assign responsible team','future-assign','primary wide',f.assigned)}${button('Confirm supply available','future-supply','wide',!f.assigned||f.delivery)}${button('Open held task','future-task','wide',!f.delivery)}<p class="footnote">Resolving logistics does not mark the construction task complete.</p>`)}
function restartConcept(){let f=s.future,steps=['Site lead checks pause reason and conditions','Material team confirms line and material readiness','Operator confirms affected work area','Site lead authorizes restart'];return futureLayout(`<span class="mono cyan">P2 / Recovery</span><h2>Review before restarting</h2><div class="context">Pause reason: weather interruption<br>Elapsed pause: 38 min<br>Procedure: approved restart checklist required<br>Restart authority: site lead</div><ol class="restart-list">${steps.map((n,i)=>`<li class="${i<f.restartStep?'done':''}"><span>${i<f.restartStep?'✓':i+1}</span><div><strong>${n}</strong><p>${i<f.restartStep?'Confirmation recorded':i===f.restartStep?'Awaiting responsible person':'Waiting for preceding checks'}</p></div></li>`).join('')}</ol><div class="result ${f.paused?'warn':''}"><h3>${f.paused?'Restart blocked':'Restart authorized'}</h3><p>${f.paused?'A timer expiring does not authorize restart. Complete the applicable checks first.':'The restart checklist is complete. Any outstanding task verification remains required.'}</p></div>${assumptions(['Restart steps must be supplied by engineering and field operations for each pause type.','No generic time cutoff or bonding-agent instruction is assumed.','Authority and access controls need production validation.'])}`,`<h2>${f.restartStep<4?steps[f.restartStep]:'Ready to resume'}</h2><label for="restartReason">Confirmation note</label><textarea id="restartReason" placeholder="Record what the responsible person checked"></textarea>${button(f.restartStep<3?'Record check':f.restartStep===3?'Authorize restart':'✓ Restart authorized','future-restart','primary wide',f.restartStep>=4)}${button('Restart checklist from beginning','future-restartReset','wide')}<p class="footnote">These are workflow stages, not actual construction instructions.</p>`)}
function fleetConcept(){let f=s.future;let machines={t1:['T-001','Lot 23','Critical task awaiting review','Site lead','Count/presence uncertain'],t2:['T-002','Lot 24','Printing normally','Operator','No action required'],t3:['T-003','Lot 25','Material delivery delayed','ICON Logistics','Review supply before continuation']};let m=machines[f.machine];return futureLayout(`<span class="mono cyan">P2 / Supervisor view</span><h2>Prioritize exceptions across sites</h2><div class="fleet-cards">${Object.entries(machines).map(([id,x])=>`<button data-machine="${id}" class="fleet-card ${id===f.machine?'selected':''}"><span class="mono">${x[0]} / ${x[1]}</span><strong>${x[2]}</strong><small>${x[3]}</small></button>`).join('')}</div><div class="context"><h3>${m[0]} · ${m[1]}</h3>${m[4]}<br>Required owner: ${m[3]}<br>Assignment: ${f.fleetAssignments[f.machine]&&f.machine!=='t2'?'Accepted by on-call team':'Not assigned in this walkthrough'}</div><div class="result ${f.machine==='t2'?'':'warn'}"><h3>${f.machine==='t2'?'Continue monitoring':'Act on this machine first'}</h3><p>Each machine retains its own task and site gates. One machine's clearance never releases another.</p></div>${assumptions(['Three machines are a demonstration fixture, not a proven staffing ratio.','Review workload, site access control and local response coverage determine capacity.','Distributed connectivity and authorization require separate engineering.'])}`,`<h2>${m[0]} · ${m[1]}</h2>${button('Assign on-call team','future-fleetAssign','primary wide',f.machine==='t2'||f.fleetAssignments[f.machine])}${button('Open machine context','future-machineContext','wide')}<p class="muted">A supervisor routes exceptions. Local operators and authorized reviewers still perform physical checks.</p>`)}
function autonomyConcept(){let f=s.future,stages=['Supply request received','Material delivered to mixer','Material profile checked','Supervisor confirmation','Print sequence ready'];return futureLayout(`<span class="mono cyan">Moonshot / Autonomous supply</span><h2>Automated replenishment with human gates</h2><div class="autonomy-flow">${stages.map((x,i)=>`<div class="context ${i===f.autoStage?'current':''}"><span class="mono ${i<f.autoStage?'cyan':'muted'}">${i<f.autoStage?'✓ Complete':i===f.autoStage?'Current':'Pending'}</span><h3>${x}</h3></div>`).join('')}</div><div class="result ${f.autoStage<4?'warn':''}"><h3>${f.autoStage===3?'Human confirmation required':f.autoStage===4?'Sequence ready':'Automated stage in progress'}</h3><p>The proposed system coordinates supply and material checks. It does not bypass unresolved inspection or safety gates.</p></div>${assumptions(['This is a proposed system architecture, not evidence that Titan supports these integrations.','Feed hardware, sensing, control interfaces and material validation must be demonstrated.','Loss of signal, material mismatch and failed delivery require a defined safe state.'])}`,`<h2>${stages[f.autoStage]}</h2>${button(f.autoStage===3?'Supervisor confirms readiness':f.autoStage===4?'✓ Sequence ready':'Advance supply stage','future-autoNext','primary wide',f.autoStage===4)}${button('Show failed delivery','future-autoFail','wide',f.autoStage===4)}<p class="footnote">This animation-free sequence illustrates system responsibilities; it does not perform replenishment.</p>`)}
function reinforcementConcept(){let f=s.future,steps=['Human prepares and presents first component','Robot proposes placement path','Supervisor confirms work zone clear','Robot places reinforcement','Human checks count and presence'];return futureLayout(`<span class="mono cyan">Moonshot / Robotic construction tasks</span><h2>Automate placement, retain the inspection gate</h2>${model()}<div class="context"><strong>${steps[f.reinforcement]}</strong><br>Stage ${f.reinforcement+1} of 5<br>${f.reinforcement===4?'Placement is finished; inspection is still required.':'No claim of autonomous singulation, grasping or safe co-working is made.'}</div>${assumptions(['Grasping, component presentation, localization and print coordination are unproven here.','Robotic reinforcement work elsewhere does not establish in-print feasibility.','Site guarding, exclusion zones and an accountable inspection authority are prerequisites.'])}`,`<h2>${steps[f.reinforcement]}</h2>${button(f.reinforcement===4?'Record inspection requirement':f.reinforcement===2?'Confirm work zone clear':'Advance placement stage','future-placeNext','primary wide')}${button('Show blocked work zone','future-zoneBlock','wide')}<p class="muted">The human remains responsible for setup, exceptions and inspection in this concept.</p>`)}
function wallConcept(){let f=s.future,sleeves=f.wall==='sleeves';return futureLayout(`<span class="mono cyan">Moonshot / Wall system redesign</span><h2>Remove a manual placement dependency</h2><div class="twocol"><div class="context"><span class="mono muted">Current concept baseline</span><h3>${sleeves?'Placed electrical sleeves':'Placed core components'}</h3><p>A manual task must be timed with the print layer and confirmed before cover-up.</p></div><div class="context"><span class="mono cyan">Exploratory alternative</span><h3>${sleeves?'Integrated service channel':'Redesigned core detail'}</h3><p>${sleeves?'A designed channel could shift service installation to a later, accessible stage.':'A different wall detail might reduce an in-print placement dependency.'}</p></div></div><div class="result warn"><h3>Design and certification review required</h3><p>This does not establish that the placed part can safely be removed. Structural, electrical, fire, moisture, inspection and code requirements must be resolved.</p></div>${assumptions(['The case study found no established automation path; that is not proof that none exists.','This concept requires architecture, structural engineering and trade review.','No automated installation or code-compliance claim is made.'])}`,`<h2>Compare the dependency</h2><label for="wallType">Design topic</label><select id="wallType" class="outcome-select"><option value="sleeves" ${sleeves?'selected':''}>Electrical sleeves</option><option value="cores" ${!sleeves?'selected':''}>Vertical core detail</option></select>${button(f.wallReviewed?'✓ Review dependency recorded':'Record design-review dependency','future-wallReview','primary wide',f.wallReviewed)}<p class="muted">This is a product-architecture exploration, not a field instruction.</p>`)}
function futureScreen(){switch(s.future.view){case'exceptions':return exceptionConcept();case'restart':return restartConcept();case'fleet':return fleetConcept();case'autonomy':return autonomyConcept();case'reinforcement':return reinforcementConcept();case'wall':return wallConcept()}}
act=function(a){ensureFuture();let f=s.future;if(!a.startsWith('future-')){futureAct(a);return}switch(a){case'future-assign':f.assigned=true;event('Exception owner assigned',f.exception,'Concept supervisor');break;case'future-supply':f.delivery=true;event('Supply confirmed',f.exception,'Concept owner');break;case'future-task':s.role='operator';s.page='operator';break;case'future-restart':{let note=$('#restartReason').value.trim();if(!note){toast('Add the responsible person’s confirmation note');return}event('Restart check recorded','Stage '+(f.restartStep+1)+' / '+note,'Concept reviewer');f.restartStep++;if(f.restartStep>=4)f.paused=false;break}case'future-restartReset':f.restartStep=0;f.paused=true;break;case'future-fleetAssign':f.fleetAssignments[f.machine]=true;event('Fleet exception assigned',f.machine,'Concept supervisor');break;case'future-machineContext':toast(f.machine==='t2'?'T-002 is printing normally':f.machine==='t1'?'T-001 · manual-task review required':'T-003 · logistics review required');break;case'future-autoNext':if(f.autoStage<4)f.autoStage++;event('Autonomy stage recorded','Stage '+f.autoStage,'Concept supervisor');break;case'future-autoFail':f.autoStage=0;toast('Delivery failed · sequence held for logistics review');break;case'future-placeNext':if(f.reinforcement<4)f.reinforcement++;else toast('Human inspection remains required before cover-up');event('Placement stage recorded','Stage '+(f.reinforcement+1),'Concept supervisor');break;case'future-zoneBlock':f.reinforcement=2;toast('Work zone blocked · motion remains on hold');break;case'future-wallReview':f.wallReviewed=true;event('Design review dependency recorded',f.wall,'Concept designer');break}render()};
render=function(){ensureFuture();if(s.role==='future')s.page='future';futureRender();let select=$('#roleSelect');select.insertAdjacentHTML('beforeend',`<option value="future" ${s.role==='future'?'selected':''}>Future concepts</option>`);select.onchange=e=>{s.role=e.target.value;s.drawer=null;s.page=s.role==='future'?'future':s.role==='operator'?'operator':s.role==='lead'?'review':'support';render()};if(s.role!=='future')return;document.body.dataset.role='future';$('.brand').innerHTML='BuildOS<span>/ Future concepts</span>';$('.role-badge').textContent='Concept workspace';$('.topnav').innerHTML='<span class="mono">P2 + Moonshot / Exploratory</span>';let heading=$('main .jobheading');heading.innerHTML='<div><span class="eyebrow muted">Future direction / proposed concepts</span><h1>Supervise the work. Resolve exceptions.</h1><span class="muted">Explore responsibilities and dependencies before committing to automation.</span></div>';$('main').innerHTML=heading.outerHTML+futureScreen();bind();document.querySelectorAll('[data-future-view]').forEach(b=>b.onclick=()=>{s.future.view=b.dataset.futureView;render()});document.querySelectorAll('[data-machine]').forEach(b=>b.onclick=()=>{s.future.machine=b.dataset.machine;s.future.fleetAssigned=false;render()});if($('#exceptionType'))$('#exceptionType').onchange=e=>{s.future.exception=e.target.value;s.future.assigned=false;s.future.delivery=false;render()};if($('#wallType'))$('#wallType').onchange=e=>{s.future.wall=e.target.value;s.future.wallReviewed=false;render()};};
render();
</script></body></html>
